services:
  traefik:
    image: traefik:v3.6
    restart: always
    networks:
      dnet:
        ipv4_address: 172.20.0.20
    ports:
      - 80:80
      - 443:443
      - 8080:8080
    environment:
      - TZ=${TZ}
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "komodo.skip"

networks:
  dnet:
    external: true
