services:
  mongo:
    image: mongo
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    ports:
      - 27017:27017
    volumes:
      - ${COMPOSE_KOMODO_DATA_DIR}/mongo_data:/data/db
      - ${COMPOSE_KOMODO_DATA_DIR}/mongo_config:/data/configdb
    networks:
      - dnet
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}
      TZ: ${TZ}
    labels:
      - "komodo.skip"

  core:
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - mongo
    env_file: ./compose.env
    networks:
      - dnet
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${COMPOSE_KOMODO_DATA_DIR}/backups:/backups
    labels:
      - "komodo.skip"
      - "traefik.enable=true"
      - "traefik.http.routers.komodo.entrypoints=web"
      - "traefik.http.routers.komodo.rule=Host(`${KOMODO_TRAEFIK_HOST}`)"
      - "traefik.http.services.komodo.loadbalancer.server.port=9120"

networks:
  dnet:
    external: true
