services:
  victoriametrics:
    container_name: victoriametrics
    image: victoriametrics/victoria-metrics:latest
    volumes:
      - ${USERDIR:-$HOME}/docker/victoriametrics/data:/victoria-metrics-data
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=100y"
      - "--httpAuth.username=${VM_USERNAME}"
      - "--httpAuth.password=${VM_PASSWORD}"
    restart: always
    environment:
      - TZ=${TZ}
    networks:
      - dnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.victoriametrics.entrypoints=websecure"
      - "traefik.http.routers.victoriametrics.tls=true"
      - "traefik.http.routers.victoriametrics.rule=Host(`${VICTORIA_HOST}`)"
      - "traefik.http.services.victoriametrics.loadbalancer.server.port=8428"

networks:
  dnet:
    external: true

