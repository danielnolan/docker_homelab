services:
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:latest
    volumes:
      - ${USERDIR:-$HOME}/docker/homeassistant/config:/config
      - /var/run/dbus:/run/dbus:ro
    environment:
      - TZ=${TZ}
    restart: always
    devices:
      - /dev/serial/by-id/usb-Nabu_Casa_ZBT-2_9C139EAC0ED8-if00:/dev/ttyACM0  # ZBT-2 (Zigbee firmware) for ZHA
    cap_add:
      - NET_ADMIN
      - NET_RAW
    network_mode: host
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homeassistant.entrypoints=websecure"
      - "traefik.http.routers.homeassistant.rule=Host(`${HA_HOST}`)"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.services.homeassistant.loadbalancer.server.url=${HA_INTERNAL_URL}"

