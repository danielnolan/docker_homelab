services:
  backrest:
    image: garethgeorge/backrest:latest
    container_name: backrest
    hostname: backrest
    restart: unless-stopped
    user: "1000:1000"
    group_add:
      - "989"
    networks:
      - dnet
    environment:
      - BACKREST_PORT=0.0.0.0:9898
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA=/data
      - XDG_CACHE_HOME=/cache
      - HOME=/home/backrest
      - TZ=${TZ}
    volumes:
      - ${USERDIR:-$HOME}/docker/backrest/data:/data
      - ${USERDIR:-$HOME}/docker/backrest/config:/config
      - ${USERDIR:-$HOME}/docker/backrest/cache:/cache
      - ${USERDIR:-$HOME}/docker/backrest/home:/home/backrest
      - ${USERDIR:-$HOME}:/userdata:ro
      - ${USERDIR:-$HOME}/.ssh/ms01-backup:/keys/ms01-backup:ro
      - ${USERDIR:-$HOME}/.ssh/known_hosts:/keys/known_hosts:ro
      - ${USERDIR:-$HOME}/docker/backrest/passwd:/etc/passwd:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 127.0.0.1:9898:9898
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backrest.entrypoints=websecure"
      - "traefik.http.routers.backrest.tls=true"
      - "traefik.http.routers.backrest.rule=Host(`${BACKREST_HOST}`)"
      - "traefik.http.services.backrest.loadbalancer.server.port=9898"

networks:
  dnet:
    external: true
