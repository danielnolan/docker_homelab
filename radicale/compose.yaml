services:
  radicale:
    container_name: radicale
    image: tomsquest/docker-radicale:latest
    restart: always
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    pids_limit: 100
    mem_limit: 256m
    volumes:
      - ${USERDIR:-$HOME}/docker/radicale/config:/config:ro
      - ${USERDIR:-$HOME}/docker/radicale/data:/data
    environment:
      - TZ=${TZ}
    ports:
      # Home Assistant (host networking) talks to Radicale here directly,
      # so it doesn't depend on Traefik/DNS or the allowlist below.
      - 127.0.0.1:5232:5232
    networks:
      - dnet
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radicale.entrypoints=websecure"
      - "traefik.http.routers.radicale.tls=true"
      - "traefik.http.routers.radicale.rule=Host(`${RADICALE_HOST}`)"
      - "traefik.http.routers.radicale.middlewares=radicale-lan-only"
      # Phones only: trusted LAN + Firewalla WireGuard clients. The IoT VLAN
      # (192.168.20.0/24) and Docker networks (incl. cloudflared) are excluded.
      - "traefik.http.middlewares.radicale-lan-only.ipallowlist.sourcerange=${RADICALE_ALLOWED_SOURCES}"
      - "traefik.http.services.radicale.loadbalancer.server.port=5232"

networks:
  dnet:
    external: true
