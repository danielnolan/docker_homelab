services:
  zwave-js:
    container_name: zwave-js
    image: zwavejs/zwave-js-ui:latest
    restart: always
    tty: true
    stop_signal: SIGINT
    environment:
      - SESSION_SECRET=${ZWAVE_SESSION_SECRET}
      - ZWAVEJS_EXTERNAL_CONFIG=/usr/src/app/store/.config-db
      - TZ=${TZ}
      # Behind Traefik (fixed dnet address, see traefik/compose.yaml): trust X-Forwarded-For only
      # from it, so login rate limiting and logs see the real client instead of one shared IP.
      - TRUST_PROXY=172.20.0.20
    volumes:
      - ${USERDIR:-$HOME}/docker/zwave-js:/usr/src/app/store
    networks:
      - dnet
    ports:
      - 127.0.0.1:3000:3000  # Websocket Server (HA only, via localhost)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zwave-js.entrypoints=websecure"
      - "traefik.http.routers.zwave-js.tls=true"
      - "traefik.http.routers.zwave-js.rule=Host(`${ZWAVE_HOST}`)"
      # IP allowlist, defined per box in ~/docker/traefik/data/config.yaml (not in git).
      - "traefik.http.routers.zwave-js.middlewares=admin-allow@file"
      - "traefik.http.services.zwave-js.loadbalancer.server.port=8091"

networks:
  dnet:
    external: true
